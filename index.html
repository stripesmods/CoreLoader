<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledriftrinth - Gorilla Tag Mod Menu Loader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e1e, #3a3a3a);
            color: #fff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            padding: 20px;
            background-color: #222;
            border-bottom: 2px solid #444;
        }
        h1 {
            font-size: 2rem;
            margin: 0;
        }
        .menu-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #2b2b2b;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        button {
            background-color: #4cafef;
            color: #fff;
            border: none;
            padding: 12px 20px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #379ad6;
        }
        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <header>
        <h1>Ledriftrinth</h1>
        <p>Mod Menu Loader for AnotherAxiom.GorillaTag</p>
    </header>

    <div class="menu-container">
        <h2>Available Mods</h2>
        <div id="mod-list">
            <!-- Mods will be dynamically loaded here -->
        </div>
        <button onclick="loadMods()">Load Mods</button>
        <button onclick="clearMods()">Clear Mods</button>
    </div>

    <footer>
        <p>Ledriftrinth © 2026 — For entertainment & customization purposes only.</p>
    </footer>

    <script>
        const mods = [
            { name: "Speed Boost", description: "Increase movement speed." },
            { name: "Custom Colors", description: "Change player color palette." },
            { name: "Gravity Flip", description: "Invert gravity for fun effects." }
        ];

        function loadMods() {
            const modList = document.getElementById('mod-list');
            modList.innerHTML = '';
            mods.forEach(mod => {
                const modItem = document.createElement('div');
                modItem.innerHTML = `<strong>${mod.name}</strong>: ${mod.description}`;
                modItem.style.margin = '10px 0';
                modList.appendChild(modItem);
            });
        }

        function clearMods() {
            document.getElementById('mod-list').innerHTML = '';
        }
    </script>
</body>
</html>
