<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171a24">
    <meta name="description" content="CoreLoader — a simple Gorilla Tag mod loader interface.">
    <title>CoreLoader — Gorilla Tag Mod Loader</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
            background: #171a24;
            color: #f4f6fb;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            text-align: center;
            background: radial-gradient(ellipse at top, #293044 0%, #171a24 65%);
        }
        header {
            padding: 28px 20px;
            background: rgba(15, 17, 24, 0.75);
            border-bottom: 1px solid #343b50;
        }
        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3rem);
            letter-spacing: 0.08em;
        }
        header p { margin: 8px 0 0; color: #b7c0d5; }
        main {
            width: min(600px, calc(100% - 32px));
            margin: 40px auto;
            padding: 24px;
            background: #222737;
            border: 1px solid #343b50;
            border-radius: 12px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.3);
        }
        h2 { margin-top: 0; }
        #mod-list { color: #d7dced; }
        .mod-item { margin: 12px 0; }
        .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 6px;
            background: #6b7cff;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        button:hover { background: #5366ec; transform: translateY(-1px); }
        button:focus-visible { outline: 3px solid #c5ccff; outline-offset: 3px; }
        footer {
            margin-top: auto;
            padding: 20px;
            color: #9da7bd;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>CoreLoader</h1>
        <p>A simple mod loader interface for AnotherAxiom.GorillaTag</p>
    </header>

    <main>
        <h2>Available Mods</h2>
        <div id="mod-list" aria-live="polite">
            <p>Choose “Show Mods” to view the available entries.</p>
        </div>
        <div class="actions">
            <button type="button" onclick="loadMods()">Show Mods</button>
            <button type="button" onclick="clearMods()">Clear List</button>
        </div>
    </main>

    <footer>
        <p>CoreLoader © 2026 — For entertainment and customization purposes only.</p>
    </footer>

    <script>
        const mods = [
            { name: "Speed Boost", description: "Increase movement speed." },
            { name: "Custom Colors", description: "Change player color palette." },
            { name: "Gravity Flip", description: "Invert gravity for fun effects." }
        ];

        function loadMods() {
            const modList = document.getElementById('mod-list');
            modList.replaceChildren();
            mods.forEach((mod) => {
                const modItem = document.createElement('div');
                modItem.className = 'mod-item';
                const name = document.createElement('strong');
                name.textContent = mod.name;
                modItem.append(name, document.createTextNode(`: ${mod.description}`));
                modList.appendChild(modItem);
            });
        }

        function clearMods() {
            const modList = document.getElementById('mod-list');
            modList.replaceChildren();
            const message = document.createElement('p');
            message.textContent = 'The list is clear.';
            modList.appendChild(message);
        }
    </script>
</body>
</html>
